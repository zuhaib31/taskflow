<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 720px;
            margin: 60px auto;
            padding: 0 20px;
            color: #2c3e50;
            line-height: 1.6;
        }
        h1 { color: #1a73e8; }
        .status {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 12px 16px;
            margin: 20px 0;
            border-radius: 4px;
        }
        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: "SF Mono", Monaco, monospace;
        }
    </style>
</head>
<body>
    <h1>TaskFlow</h1>
    <p>A task and project management application.</p>
    <div class="status">
        ✅ Application is running successfully.
    </div>
    <p>Authentication and full features are under development.</p>
    <p>Health check: <code>GET /health</code></p>
</body>
</html>
