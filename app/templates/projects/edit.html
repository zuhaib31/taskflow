{% extends "base.html" %}

{% block title %}Edit {{ project.name }} - TaskFlow{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Edit project</h1>
            <p class="subtitle">Update the project's name or description.</p>
        </div>

        <form method="POST" action="{{ url_for('projects.update', project_id=project.id) }}" class="form">
            <div class="form-group">
                <label for="name">Project name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ project.name }}"
                    required
                    maxlength="100"
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="description">Description <span class="optional">(optional)</span></label>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    maxlength="2000"
                >{{ project.description or '' }}</textarea>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('projects.show', project_id=project.id) }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary btn-inline">Save changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
