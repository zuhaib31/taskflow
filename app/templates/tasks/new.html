{% extends "base.html" %}

{% block title %}New Task - {{ project.name }} - TaskFlow{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="breadcrumb">
            <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
            <span class="breadcrumb-separator">/</span>
            <a href="{{ url_for('projects.show', project_id=project.id) }}">{{ project.name }}</a>
            <span class="breadcrumb-separator">/</span>
            <span>New task</span>
        </div>

        <div class="form-header">
            <h1>New task</h1>
            <p class="subtitle">Add a task to <strong>{{ project.name }}</strong>.</p>
        </div>

        <form method="POST" action="{{ url_for('tasks.create', project_id=project.id) }}" class="form">
            <div class="form-group">
                <label for="title">Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ title or '' }}"
                    required
                    maxlength="200"
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="description">Description <span class="optional">(optional)</span></label>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    maxlength="5000"
                >{{ description or '' }}</textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        {% for s in valid_statuses %}
                            <option value="{{ s }}" {% if status == s or (not status and s == 'todo') %}selected{% endif %}>
                                {{ s.replace('_', ' ').title() }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority">
                        {% for p in valid_priorities %}
                            <option value="{{ p }}" {% if priority == p or (not priority and p == 'medium') %}selected{% endif %}>
                                {{ p.title() }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="due_date">Due date <span class="optional">(optional)</span></label>
                <input
                    type="date"
                    id="due_date"
                    name="due_date"
                    value="{{ due_date_str or '' }}"
                >
            </div>

            <div class="form-actions">
                <a href="{{ url_for('projects.show', project_id=project.id) }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary btn-inline">Create Task</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
